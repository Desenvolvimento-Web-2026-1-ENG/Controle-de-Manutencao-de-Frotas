<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>
  
  <!-- Sidebar -->
  <rect width="240" height="800" fill="#1e293b"/>
  <text x="24" y="45" fill="#38bdf8" font-size="20" font-weight="bold">🚛 FrotaGestão</text>
  <text x="24" y="70" fill="#94a3b8" font-size="12">Controle de Manutenção</text>
  
  <!-- Menu Items -->
  <text x="32" y="125" fill="#94a3b8" font-size="14">📊 Dashboard &amp; Alertas</text>
  <text x="32" y="165" fill="#94a3b8" font-size="14">🚚 Veículos da Frota</text>
  <rect x="12" y="180" width="216" height="40" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="32" y="205" fill="#60a5fa" font-size="14" font-weight="bold">📋 Ordens de Serviço (O.S.)</text>
  <text x="32" y="245" fill="#94a3b8" font-size="14">⚙️ Planos Preventivos</text>
  
  <!-- Header Bar -->
  <rect x="240" width="960" height="70" fill="#1e293b"/>
  <text x="270" y="42" fill="#f8fafc" font-size="20" font-weight="bold">Ordens de Serviço (Peças &amp; Mão de Obra)</text>
  
  <!-- Botão Nova OS -->
  <rect x="990" y="18" width="180" height="36" rx="6" fill="#3b82f6"/>
  <text x="1015" y="41" fill="#ffffff" font-size="13" font-weight="bold">+ Abrir Nova O.S.</text>
  
  <!-- Content Area -->
  <!-- API Banner Indicator -->
  <rect x="270" y="90" width="900" height="32" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-dasharray="4"/>
  <text x="285" y="111" fill="#38bdf8" font-size="12" font-weight="600">🔗 INTEGRAÇÃO API: GET /api/ordens-servico | POST /api/ordens-servico | PATCH /api/ordens-servico/:id/status</text>
  
  <!-- Modal / Form Overlay Mockup of OS -->
  <rect x="270" y="135" width="900" height="630" rx="10" fill="#1e293b" stroke="#334155"/>
  
  <!-- Form Header -->
  <text x="300" y="175" fill="#f8fafc" font-size="18" font-weight="bold">Registro e Composição de Ordem de Serviço (O.S.)</text>
  
  <!-- Veículo & Tipo -->
  <text x="300" y="210" fill="#cbd5e1" font-size="12" font-weight="600">Veículo da Frota *</text>
  <rect x="300" y="220" width="400" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="315" y="243" fill="#ffffff" font-size="13">BRA2E19 - Volvo FH 540 (92.400 km) ▾</text>
  
  <text x="730" y="210" fill="#cbd5e1" font-size="12" font-weight="600">Tipo de Manutenção *</text>
  <rect x="730" y="220" width="190" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="745" y="243" fill="#cbd5e1" font-size="13">PREVENTIVA ▾</text>
  
  <text x="940" y="210" fill="#cbd5e1" font-size="12" font-weight="600">KM no Momento *</text>
  <rect x="940" y="220" width="200" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="955" y="243" fill="#ffffff" font-size="13">92.400 km</text>
  
  <!-- Mecânico & Descrição -->
  <text x="300" y="285" fill="#cbd5e1" font-size="12" font-weight="600">Mecânico Responsável (Admin) *</text>
  <rect x="300" y="295" width="400" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="315" y="318" fill="#ffffff" font-size="13">Carlos Silva (Mecânico Chefe)</text>
  
  <text x="730" y="285" fill="#cbd5e1" font-size="12" font-weight="600">Descrição dos Serviços *</text>
  <rect x="730" y="295" width="410" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="745" y="318" fill="#ffffff" font-size="13">Revisão geral periódica e troca de fluidos</text>
  
  <!-- Tabela de Peças Utilizadas -->
  <text x="300" y="360" fill="#38bdf8" font-size="14" font-weight="bold">📦 Peças e Materiais Utilizados</text>
  <rect x="300" y="375" width="840" height="150" rx="6" fill="#0f172a" stroke="#334155"/>
  <rect x="300" y="375" width="840" height="30" rx="6" fill="#1e293b"/>
  <text x="315" y="395" fill="#94a3b8" font-size="11" font-weight="bold">ITEM / DESCRIÇÃO</text>
  <text x="650" y="395" fill="#94a3b8" font-size="11" font-weight="bold">QTD</text>
  <text x="750" y="395" fill="#94a3b8" font-size="11" font-weight="bold">VALOR UNIT.</text>
  <text x="900" y="395" fill="#94a3b8" font-size="11" font-weight="bold">TOTAL</text>
  <text x="1080" y="395" fill="#94a3b8" font-size="11" font-weight="bold">AÇÃO</text>
  
  <!-- Peça 1 -->
  <text x="315" y="430" fill="#ffffff" font-size="13">Óleo Motor 15W40 Galão 20L</text>
  <text x="660" y="430" fill="#ffffff" font-size="13">2</text>
  <text x="750" y="430" fill="#ffffff" font-size="13">R$ 380,00</text>
  <text x="900" y="430" fill="#34d399" font-size="13" font-weight="bold">R$ 760,00</text>
  <text x="1090" y="430" fill="#ef4444" font-size="12">✕</text>
  
  <!-- Peça 2 -->
  <line x1="300" y1="450" x2="1140" y2="450" stroke="#1e293b"/>
  <text x="315" y="480" fill="#ffffff" font-size="13">Filtro de Óleo e Ar Primário</text>
  <text x="660" y="480" fill="#ffffff" font-size="13">2</text>
  <text x="750" y="480" fill="#ffffff" font-size="13">R$ 270,00</text>
  <text x="900" y="480" fill="#34d399" font-size="13" font-weight="bold">R$ 540,00</text>
  <text x="1090" y="480" fill="#ef4444" font-size="12">✕</text>
  
  <!-- Subtotal Peças -->
  <line x1="300" y1="500" x2="1140" y2="500" stroke="#334155"/>
  <text x="750" y="520" fill="#94a3b8" font-size="12" font-weight="bold">Total em Peças:</text>
  <text x="900" y="520" fill="#38bdf8" font-size="14" font-weight="bold">R$ 1.300,00</text>
  
  <!-- Mão de Obra e Total Geral -->
  <rect x="300" y="540" width="840" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="320" y="570" fill="#38bdf8" font-size="14" font-weight="bold">🔧 Mão de Obra:</text>
  <text x="320" y="600" fill="#cbd5e1" font-size="13">6 horas x R$ 90,00/h = <tspan fill="#34d399" font-weight="bold">R$ 540,00</tspan></text>
  
  <rect x="750" y="555" width="370" height="60" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="770" y="580" fill="#94a3b8" font-size="12">VALOR TOTAL DA ORDEM DE SERVIÇO:</text>
  <text x="770" y="605" fill="#10b981" font-size="22" font-weight="bold">R$ 1.840,00</text>
  
  <!-- Botões de Ação -->
  <rect x="750" y="700" width="180" height="42" rx="6" fill="#f59e0b"/>
  <text x="770" y="726" fill="#ffffff" font-size="13" font-weight="bold">Em Andamento</text>
  
  <rect x="950" y="700" width="190" height="42" rx="6" fill="#10b981"/>
  <text x="975" y="726" fill="#ffffff" font-size="13" font-weight="bold">✓ Concluir e Liberar</text>
</svg>
