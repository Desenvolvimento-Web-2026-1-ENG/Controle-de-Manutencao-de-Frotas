<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f1f5f9"/>
  
  <!-- Sidebar -->
  <rect width="240" height="800" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="240" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="40" fill="#0f172a" font-size="16" font-weight="bold">🚛 WEBDEV FROTAS</text>
  
  <text x="32" y="104" fill="#64748b" font-size="13">📊 Dashboard</text>
  <text x="32" y="144" fill="#64748b" font-size="13">🚗 Veículos</text>
  <text x="32" y="184" fill="#64748b" font-size="13">📅 Planos de Manutenção</text>
  <rect x="12" y="200" width="216" height="38" rx="8" fill="#e0edff"/>
  <text x="32" y="224" fill="#1d4ed8" font-size="13" font-weight="bold">📋 Ordens de Serviço (O.S.)</text>
  <text x="32" y="264" fill="#64748b" font-size="13">👥 Mecânicos</text>
  <text x="32" y="304" fill="#64748b" font-size="13">📈 Relatórios</text>
  <text x="32" y="760" fill="#ef4444" font-size="13">🚪 Sair</text>
  
  <!-- Header Bar (Solid Blue) -->
  <rect x="240" width="960" height="64" fill="#1d4ed8"/>
  <text x="265" y="38" fill="#ffffff" font-size="18" font-weight="bold">Ordens de Serviço (Peças &amp; Mão de Obra)</text>
  
  <!-- Modal Window -->
  <rect x="330" y="90" width="780" height="670" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
  <text x="360" y="130" fill="#0f172a" font-size="18" font-weight="bold">Abertura de Ordem de Serviço (O.S.)</text>
  <line x1="330" y1="150" x2="1110" y2="150" stroke="#e2e8f0"/>
  
  <!-- Fields Row 1 -->
  <text x="360" y="180" fill="#64748b" font-size="11" font-weight="600">Veículo da Frota *</text>
  <rect x="360" y="190" width="340" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="375" y="213" fill="#0f172a" font-size="12">BRA2E19 - Volvo FH 540 (92.400 km) ▾</text>
  
  <text x="720" y="180" fill="#64748b" font-size="11" font-weight="600">Tipo de Manutenção *</text>
  <rect x="720" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="735" y="213" fill="#0f172a" font-size="12">PREVENTIVA ▾</text>
  
  <text x="920" y="180" fill="#64748b" font-size="11" font-weight="600">KM no Momento *</text>
  <rect x="920" y="190" width="150" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="935" y="213" fill="#0f172a" font-size="12" font-weight="bold">92.400</text>
  
  <!-- Fields Row 2 -->
  <text x="360" y="250" fill="#64748b" font-size="11" font-weight="600">Mecânico Responsável *</text>
  <rect x="360" y="260" width="340" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="375" y="283" fill="#0f172a" font-size="12">Carlos Silva (Mecânico Chefe)</text>
  
  <text x="720" y="250" fill="#64748b" font-size="11" font-weight="600">Descrição do Serviço *</text>
  <rect x="720" y="260" width="350" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="735" y="283" fill="#0f172a" font-size="12">Revisão periódica preventiva de 90.000 KM</text>
  
  <!-- Peças Builder Section -->
  <text x="360" y="325" fill="#0f172a" font-size="13" font-weight="bold">📦 Peças e Materiais Utilizados</text>
  <rect x="360" y="340" width="710" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  
  <text x="375" y="365" fill="#64748b" font-size="11" font-weight="bold">ITEM / DESCRIÇÃO</text>
  <text x="640" y="365" fill="#64748b" font-size="11" font-weight="bold">QTD</text>
  <text x="730" y="365" fill="#64748b" font-size="11" font-weight="bold">VALOR UNIT.</text>
  <text x="860" y="365" fill="#64748b" font-size="11" font-weight="bold">SUBTOTAL</text>
  
  <line x1="360" y1="375" x2="1070" y2="375" stroke="#e2e8f0"/>
  
  <text x="375" y="405" fill="#0f172a" font-size="12">Óleo Motor 15W40 20L</text>
  <text x="645" y="405" fill="#0f172a" font-size="12">2</text>
  <text x="730" y="405" fill="#0f172a" font-size="12">R$ 380,00</text>
  <text x="860" y="405" fill="#16a34a" font-size="12" font-weight="bold">R$ 760,00</text>
  <text x="1035" y="405" fill="#dc2626" font-size="12">✕</text>
  
  <text x="375" y="445" fill="#0f172a" font-size="12">Filtro de Óleo e Ar</text>
  <text x="645" y="445" fill="#0f172a" font-size="12">2</text>
  <text x="730" y="445" fill="#0f172a" font-size="12">R$ 270,00</text>
  <text x="860" y="445" fill="#16a34a" font-size="12" font-weight="bold">R$ 540,00</text>
  <text x="1035" y="445" fill="#dc2626" font-size="12">✕</text>
  
  <!-- Mão de Obra -->
  <rect x="360" y="490" width="710" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="520" fill="#64748b" font-size="12">Mão de Obra: <tspan font-weight="bold" fill="#0f172a">6 horas x R$ 90,00/h</tspan></text>
  <text x="380" y="540" fill="#64748b" font-size="11">Total Mão de Obra: <tspan font-weight="bold" fill="#16a34a">R$ 540,00</tspan></text>
  
  <!-- Total Card -->
  <rect x="360" y="575" width="710" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="380" y="605" fill="#64748b" font-size="12">VALOR TOTAL DA ORDEM DE SERVIÇO:</text>
  <text x="920" y="608" fill="#16a34a" font-size="20" font-weight="bold">R$ 1.840,00</text>
  
  <!-- Footer -->
  <line x1="330" y1="695" x2="1110" y2="695" stroke="#e2e8f0"/>
  <rect x="910" y="715" width="160" height="36" rx="6" fill="#1d4ed8"/>
  <text x="935" y="738" fill="#ffffff" font-size="13" font-weight="bold">Salvar e Abrir O.S.</text>
</svg>
