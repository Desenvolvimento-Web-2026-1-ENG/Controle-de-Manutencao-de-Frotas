<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f1f5f9"/>
  
  <!-- Sidebar -->
  <rect width="240" height="800" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="240" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="40" fill="#0f172a" font-size="16" font-weight="bold">🚛 WEBDEV FROTAS</text>
  
  <text x="32" y="104" fill="#64748b" font-size="13">📊 Dashboard</text>
  <rect x="12" y="120" width="216" height="38" rx="8" fill="#e0edff"/>
  <text x="32" y="144" fill="#1d4ed8" font-size="13" font-weight="bold">🚗 Veículos</text>
  <text x="32" y="184" fill="#64748b" font-size="13">📅 Planos de Manutenção</text>
  <text x="32" y="224" fill="#64748b" font-size="13">📋 Ordens de Serviço (O.S.)</text>
  <text x="32" y="264" fill="#64748b" font-size="13">👥 Mecânicos</text>
  <text x="32" y="304" fill="#64748b" font-size="13">📈 Relatórios</text>
  <text x="32" y="760" fill="#ef4444" font-size="13">🚪 Sair</text>
  
  <!-- Header Bar (Solid Blue) -->
  <rect x="240" width="960" height="64" fill="#1d4ed8"/>
  <text x="265" y="38" fill="#ffffff" font-size="18" font-weight="bold">Ficha e Histórico de Manutenções</text>
  
  <!-- Modal Window -->
  <rect x="360" y="95" width="720" height="660" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
  <text x="390" y="135" fill="#0f172a" font-size="18" font-weight="bold">Ficha e Histórico do Veículo</text>
  <line x1="360" y1="155" x2="1080" y2="155" stroke="#e2e8f0"/>
  
  <!-- Header info box -->
  <rect x="390" y="175" width="660" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="205" fill="#1d4ed8" font-size="20" font-weight="bold">BRA2E19</text>
  <text x="520" y="203" fill="#0f172a" font-size="14" font-weight="bold">Volvo FH 540 6x4 (2022) — Pesado</text>
  <text x="410" y="230" fill="#64748b" font-size="12">KM Atual: <tspan fill="#0f172a" font-weight="bold">92.400 km</tspan> | Plano: <tspan fill="#1d4ed8" font-weight="bold">Frota Pesada (15.000 km / 6 meses)</tspan></text>
  
  <!-- History Title -->
  <text x="390" y="275" fill="#0f172a" font-size="14" font-weight="bold">Linha do Tempo de Manutenções Realizadas</text>
  <text x="900" y="275" fill="#16a34a" font-size="13" font-weight="bold">Total: R$ 3.460,00</text>
  
  <!-- Timeline Item 1 -->
  <rect x="390" y="295" width="660" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="325" fill="#1d4ed8" font-size="13" font-weight="bold">OS-2026-001 (PREVENTIVA)</text>
  <text x="940" y="325" fill="#16a34a" font-size="13" font-weight="bold">R$ 1.840,00</text>
  <text x="410" y="350" fill="#0f172a" font-size="12" font-weight="600">Revisão periódica preventiva de 75.000 km</text>
  <text x="410" y="375" fill="#64748b" font-size="11">Data: 11/03/2026 | Mecânico: Carlos Silva | Peças: Óleo 15W40, Filtros de Óleo, Ar e Racor</text>
  
  <!-- Timeline Item 2 -->
  <rect x="390" y="415" width="660" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="445" fill="#1d4ed8" font-size="13" font-weight="bold">OS-2025-089 (PREVENTIVA)</text>
  <text x="940" y="445" fill="#16a34a" font-size="13" font-weight="bold">R$ 1.620,00</text>
  <text x="410" y="470" fill="#0f172a" font-size="12" font-weight="600">Revisão periódica preventiva de 60.000 km</text>
  <text x="410" y="495" fill="#64748b" font-size="11">Data: 15/10/2025 | Mecânico: José Mendes | Peças: Troca de fluidos e lubrificação</text>
  
  <!-- Footer -->
  <line x1="360" y1="695" x2="1080" y2="695" stroke="#e2e8f0"/>
  <rect x="940" y="710" width="110" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="975" y="732" fill="#0f172a" font-size="12" font-weight="bold">Fechar</text>
</svg>
