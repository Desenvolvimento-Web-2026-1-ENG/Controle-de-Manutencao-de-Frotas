<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>
  
  <!-- Sidebar -->
  <rect width="240" height="800" fill="#1e293b"/>
  <text x="24" y="45" fill="#38bdf8" font-size="20" font-weight="bold">🚛 FrotaGestão</text>
  <text x="24" y="70" fill="#94a3b8" font-size="12">Controle de Manutenção</text>
  
  <!-- Menu Items -->
  <text x="32" y="125" fill="#94a3b8" font-size="14">📊 Dashboard &amp; Alertas</text>
  <rect x="12" y="140" width="216" height="40" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="32" y="165" fill="#60a5fa" font-size="14" font-weight="bold">🚚 Veículos da Frota</text>
  <text x="32" y="205" fill="#94a3b8" font-size="14">📋 Ordens de Serviço (O.S.)</text>
  <text x="32" y="245" fill="#94a3b8" font-size="14">⚙️ Planos Preventivos</text>
  
  <!-- Header Bar -->
  <rect x="240" width="960" height="70" fill="#1e293b"/>
  <text x="270" y="42" fill="#f8fafc" font-size="20" font-weight="bold">Gestão da Frota de Veículos</text>
  
  <!-- Botão Novo Veículo -->
  <rect x="1000" y="18" width="170" height="36" rx="6" fill="#10b981"/>
  <text x="1025" y="41" fill="#ffffff" font-size="13" font-weight="bold">+ Novo Veículo</text>
  
  <!-- Content Area -->
  <!-- API Banner Indicator -->
  <rect x="270" y="90" width="900" height="32" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-dasharray="4"/>
  <text x="285" y="111" fill="#38bdf8" font-size="12" font-weight="600">🔗 INTEGRAÇÃO API: GET /api/veiculos?status=...&amp;busca=... | PATCH /api/veiculos/:id/km | DELETE /api/veiculos/:id</text>
  
  <!-- Search and Filters Bar -->
  <rect x="270" y="135" width="900" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <rect x="290" y="148" width="320" height="34" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="305" y="170" fill="#64748b" font-size="13">🔍 Buscar por placa, modelo ou motorista...</text>
  
  <rect x="630" y="148" width="150" height="34" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="645" y="170" fill="#cbd5e1" font-size="13">Status: Todos ▾</text>
  
  <rect x="800" y="148" width="160" height="34" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="815" y="170" fill="#cbd5e1" font-size="13">Categoria: Todas ▾</text>
  
  <rect x="980" y="148" width="170" height="34" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
  <text x="995" y="170" fill="#f87171" font-size="12" font-weight="bold">⚠️ Apenas Alertas</text>
  
  <!-- Table Container -->
  <rect x="270" y="210" width="900" height="550" rx="10" fill="#1e293b" stroke="#334155"/>
  
  <!-- Table Header -->
  <rect x="270" y="210" width="900" height="45" rx="10" fill="#334155"/>
  <text x="290" y="238" fill="#94a3b8" font-size="12" font-weight="bold">PLACA / MODELO</text>
  <text x="470" y="238" fill="#94a3b8" font-size="12" font-weight="bold">KM ATUAL</text>
  <text x="590" y="238" fill="#94a3b8" font-size="12" font-weight="bold">PRÓXIMA REVISÃO</text>
  <text x="760" y="238" fill="#94a3b8" font-size="12" font-weight="bold">STATUS OPERACIONAL</text>
  <text x="940" y="238" fill="#94a3b8" font-size="12" font-weight="bold">STATUS REVISÃO</text>
  <text x="1090" y="238" fill="#94a3b8" font-size="12" font-weight="bold">AÇÕES</text>
  
  <!-- Table Row 1 -->
  <line x1="270" y1="310" x2="1170" y2="310" stroke="#334155"/>
  <text x="290" y="280" fill="#ffffff" font-size="14" font-weight="bold">BRA2E19</text>
  <text x="290" y="298" fill="#94a3b8" font-size="12">Volvo FH 540 (2022)</text>
  <text x="470" y="288" fill="#ffffff" font-size="14">92.400 km</text>
  <text x="590" y="280" fill="#ef4444" font-size="13" font-weight="bold">90.000 km</text>
  <text x="590" y="298" fill="#ef4444" font-size="11">Vencido (-2.400 km)</text>
  <rect x="760" y="272" width="130" height="24" rx="4" fill="#ef4444" fill-opacity="0.2"/>
  <text x="770" y="288" fill="#f87171" font-size="11" font-weight="bold">ALERTA REVISÃO</text>
  <rect x="940" y="272" width="80" height="24" rx="4" fill="#ef4444"/>
  <text x="955" y="288" fill="#ffffff" font-size="11" font-weight="bold">CRÍTICO</text>
  <text x="1090" y="288" fill="#38bdf8" font-size="13">👁️ ✏️ 🗑️</text>
  
  <!-- Table Row 2 -->
  <line x1="270" y1="375" x2="1170" y2="375" stroke="#334155"/>
  <text x="290" y="345" fill="#ffffff" font-size="14" font-weight="bold">RQX4F88</text>
  <text x="290" y="363" fill="#94a3b8" font-size="12">M. Benz Accelo (2023)</text>
  <text x="470" y="353" fill="#ffffff" font-size="14">39.500 km</text>
  <text x="590" y="345" fill="#f59e0b" font-size="13" font-weight="bold">40.000 km</text>
  <text x="590" y="363" fill="#f59e0b" font-size="11">Faltam 500 km</text>
  <rect x="760" y="337" width="130" height="24" rx="4" fill="#ef4444" fill-opacity="0.2"/>
  <text x="770" y="353" fill="#f87171" font-size="11" font-weight="bold">ALERTA REVISÃO</text>
  <rect x="940" y="337" width="80" height="24" rx="4" fill="#f59e0b"/>
  <text x="950" y="353" fill="#ffffff" font-size="11" font-weight="bold">ATENÇÃO</text>
  <text x="1090" y="353" fill="#38bdf8" font-size="13">👁️ ✏️ 🗑️</text>
  
  <!-- Table Row 3 -->
  <line x1="270" y1="440" x2="1170" y2="440" stroke="#334155"/>
  <text x="290" y="410" fill="#ffffff" font-size="14" font-weight="bold">GHJ7A23</text>
  <text x="290" y="428" fill="#94a3b8" font-size="12">VW Delivery 11.180 (2021)</text>
  <text x="470" y="418" fill="#ffffff" font-size="14">58.000 km</text>
  <text x="590" y="410" fill="#10b981" font-size="13" font-weight="bold">65.000 km</text>
  <text x="590" y="428" fill="#94a3b8" font-size="11">Faltam 7.000 km</text>
  <rect x="760" y="402" width="130" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="775" y="418" fill="#34d399" font-size="11" font-weight="bold">EM OPERAÇÃO</text>
  <rect x="940" y="402" width="80" height="24" rx="4" fill="#10b981"/>
  <text x="955" y="418" fill="#ffffff" font-size="11" font-weight="bold">EM DIA</text>
  <text x="1090" y="418" fill="#38bdf8" font-size="13">👁️ ✏️ 🗑️</text>
  
  <!-- Table Row 4 -->
  <line x1="270" y1="505" x2="1170" y2="505" stroke="#334155"/>
  <text x="290" y="475" fill="#ffffff" font-size="14" font-weight="bold">XYZ9K88</text>
  <text x="290" y="493" fill="#94a3b8" font-size="12">Scania R 450 (2020)</text>
  <text x="470" y="483" fill="#ffffff" font-size="14">145.000 km</text>
  <text x="590" y="475" fill="#38bdf8" font-size="13" font-weight="bold">150.000 km</text>
  <text x="590" y="493" fill="#94a3b8" font-size="11">Na Oficina</text>
  <rect x="760" y="467" width="130" height="24" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="770" y="483" fill="#60a5fa" font-size="11" font-weight="bold">EM MANUTENÇÃO</text>
  <rect x="940" y="467" width="80" height="24" rx="4" fill="#3b82f6"/>
  <text x="950" y="483" fill="#ffffff" font-size="11" font-weight="bold">EM OS</text>
  <text x="1090" y="483" fill="#38bdf8" font-size="13">👁️ ✏️ 🗑️</text>
</svg>
