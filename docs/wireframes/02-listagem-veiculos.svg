  <text x="810" y="381" fill="#ffffff" font-size="9" font-weight="bold">OK</text>
  <text x="940" y="380" fill="#1d4ed8" font-size="12">Frota Média</text>
  <text x="1080" y="380" fill="#1d4ed8" font-size="12">👁️ ⚡ ✏️ 🗑️</text>

  <!-- Footer -->
  <text x="480" y="785" fill="#94a3b8" font-size="11">WEBDEV FROTAS © 2026 - Sistema de Logística</text>
