  <text x="540" y="320" fill="#0f172a" font-size="13" font-weight="bold">39.500 km</text>
  <text x="650" y="320" fill="#f59e0b" font-size="13" font-weight="bold">40.000 km</text>
  <rect x="790" y="307" width="80" height="20" rx="10" fill="#f59e0b"/>
  <text x="805" y="321" fill="#ffffff" font-size="9" font-weight="bold">EM BREVE</text>
  <text x="940" y="320" fill="#1d4ed8" font-size="12">Frota Média</text>
  <text x="1080" y="320" fill="#1d4ed8" font-size="12">👁️ ⚡ ✏️ 🗑️</text>
  
