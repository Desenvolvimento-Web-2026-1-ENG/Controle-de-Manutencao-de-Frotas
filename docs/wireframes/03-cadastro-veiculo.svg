<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f1f5f9"/>
  
  <!-- Sidebar -->
  <rect width="240" height="800" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="240" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="40" fill="#0f172a" font-size="16" font-weight="bold">🚛 WEBDEV FROTAS</text>
  
  <text x="32" y="104" fill="#64748b" font-size="13">📊 Dashboard</text>
  <rect x="12" y="120" width="216" height="38" rx="8" fill="#e0edff"/>
  <text x="32" y="144" fill="#1d4ed8" font-size="13" font-weight="bold">🚗 Veículos</text>
  <text x="32" y="184" fill="#64748b" font-size="13">📅 Planos de Manutenção</text>
  <text x="32" y="224" fill="#64748b" font-size="13">📋 Ordens de Serviço (O.S.)</text>
  <text x="32" y="264" fill="#64748b" font-size="13">👥 Mecânicos</text>
  <text x="32" y="304" fill="#64748b" font-size="13">📈 Relatórios</text>
  <text x="32" y="760" fill="#ef4444" font-size="13">🚪 Sair</text>
  
  <!-- Header Bar (Solid Blue) -->
  <rect x="240" width="960" height="64" fill="#1d4ed8"/>
  <text x="265" y="38" fill="#ffffff" font-size="18" font-weight="bold">Cadastro e Edição de Veículo</text>
  
  <!-- Modal Mockup Window (Clean White Card) -->
  <rect x="360" y="100" width="720" height="650" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
  
  <!-- Modal Header -->
  <text x="390" y="145" fill="#0f172a" font-size="18" font-weight="bold">Cadastrar Novo Veículo na Frota</text>
  <line x1="360" y1="170" x2="1080" y2="170" stroke="#e2e8f0"/>
  
  <!-- Form Fields -->
  <!-- Placa -->
  <text x="390" y="205" fill="#64748b" font-size="12" font-weight="600">Placa do Veículo *</text>
  <rect x="390" y="215" width="200" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="405" y="239" fill="#0f172a" font-size="13" font-weight="bold">MER3A89</text>
  
  <!-- Marca -->
  <text x="615" y="205" fill="#64748b" font-size="12" font-weight="600">Marca *</text>
  <rect x="615" y="215" width="200" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="630" y="239" fill="#0f172a" font-size="13">Mercedes-Benz</text>
  
  <!-- Modelo -->
  <text x="840" y="205" fill="#64748b" font-size="12" font-weight="600">Modelo *</text>
  <rect x="840" y="215" width="210" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="855" y="239" fill="#0f172a" font-size="13">Actros 2651</text>
  
  <!-- Ano -->
  <text x="390" y="285" fill="#64748b" font-size="12" font-weight="600">Ano *</text>
  <rect x="390" y="295" width="200" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="405" y="319" fill="#0f172a" font-size="13">2023</text>
  
  <!-- KM Atual -->
  <text x="615" y="285" fill="#64748b" font-size="12" font-weight="600">KM Atual Registrado *</text>
  <rect x="615" y="295" width="200" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="630" y="319" fill="#0f172a" font-size="13" font-weight="bold">60.000</text>
  
  <!-- Categoria -->
  <text x="840" y="285" fill="#64748b" font-size="12" font-weight="600">Categoria da Frota</text>
  <rect x="840" y="295" width="210" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="855" y="319" fill="#0f172a" font-size="13">Pesado ▾</text>
  
  <!-- Plano Select -->
  <text x="390" y="365" fill="#64748b" font-size="12" font-weight="600">Plano de Manutenção Preventiva Vinculado *</text>
  <rect x="390" y="375" width="660" height="38" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="405" y="399" fill="#1d4ed8" font-size="13" font-weight="bold">Plano Frota Pesada (a cada 15.000 km ou 6 meses) ▾</text>
  
  <!-- Motorista -->
  <text x="390" y="445" fill="#64748b" font-size="12" font-weight="600">Motorista Responsável</text>
  <rect x="390" y="455" width="660" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="405" y="479" fill="#0f172a" font-size="13">Antônio Prado</text>
  
  <!-- Banner Projeção -->
  <rect x="390" y="520" width="660" height="70" rx="8" fill="#e0edff" stroke="#bfdbfe"/>
  <text x="410" y="545" fill="#1d4ed8" font-size="12" font-weight="bold">⚡ Projeção Automática do Próximo Ciclo de Revisão:</text>
  <text x="410" y="568" fill="#1e40af" font-size="12">KM da Revisão: <tspan font-weight="bold">75.000 km</tspan> | Data Estimada: <tspan font-weight="bold">25/02/2027</tspan></text>
  
  <!-- Modal Footer -->
  <line x1="360" y1="670" x2="1080" y2="670" stroke="#e2e8f0"/>
  <rect x="790" y="690" width="120" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="825" y="714" fill="#64748b" font-size="13" font-weight="bold">Cancelar</text>
  
  <rect x="930" y="690" width="130" height="38" rx="6" fill="#1d4ed8"/>
  <text x="955" y="714" fill="#ffffff" font-size="13" font-weight="bold">Salvar Veículo</text>
</svg>
