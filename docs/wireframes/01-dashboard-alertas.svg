  <text x="285" y="425" fill="#0f172a" font-size="12" font-weight="bold">DEF-9012</text>
  <text x="360" y="425" fill="#0f172a" font-size="12">Ford Ranger</text>
  <text x="460" y="425" fill="#0f172a" font-size="12">75,100</text>
  <text x="540" y="425" fill="#64748b" font-size="11">Alinhamento</text>
  <rect x="655" y="412" width="50" height="20" rx="10" fill="#16a34a"/>
  <text x="670" y="426" fill="#ffffff" font-size="9" font-weight="bold">OK</text>
  <text x="750" y="425" fill="#1d4ed8" font-size="11" font-weight="600">✏️ Criar O.S.  👁️</text>

