  <text x="890" y="285" fill="#64748b" font-size="10" font-weight="bold">O.S. #</text>
  <text x="940" y="285" fill="#64748b" font-size="10" font-weight="bold">VEÍCULO</text>
  <text x="1000" y="285" fill="#64748b" font-size="10" font-weight="bold">SERVIÇO</text>
  <text x="1060" y="285" fill="#64748b" font-size="10" font-weight="bold">CUSTO</text>
  <text x="1115" y="285" fill="#64748b" font-size="10" font-weight="bold">STATUS</text>

  <text x="890" y="315" fill="#1d4ed8" font-size="10" font-weight="bold">OS-00123</text>
  <text x="940" y="315" fill="#0f172a" font-size="10">VW Gol</text>
  <text x="1000" y="315" fill="#64748b" font-size="10">Freios</text>
  <text x="1060" y="315" fill="#0f172a" font-size="10" font-weight="bold">R$ 850</text>
  <rect x="1105" y="303" width="60" height="18" rx="4" fill="#dcfce7"/>
  <text x="1112" y="315" fill="#16a34a" font-size="8" font-weight="bold">Concluída</text>

  <text x="890" y="345" fill="#1d4ed8" font-size="10" font-weight="bold">OS-00122</text>
  <text x="940" y="345" fill="#0f172a" font-size="10">F. Ranger</text>
  <text x="1000" y="345" fill="#64748b" font-size="10">Suspensão</text>
  <text x="1060" y="345" fill="#0f172a" font-size="10" font-weight="bold">R$ 1.200</text>
  <rect x="1105" y="333" width="65" height="18" rx="4" fill="#fef3c7"/>
