  <rect x="925" y="560" width="35" height="130" rx="3" fill="#2563eb"/>
  <rect x="975" y="600" width="35" height="90" rx="3" fill="#1d4ed8"/>
  <rect x="1025" y="600" width="35" height="90" rx="3" fill="#ea580c"/>
  <rect x="1075" y="660" width="35" height="30" rx="3" fill="#16a34a"/>
  <rect x="1125" y="660" width="35" height="30" rx="3" fill="#22c55e"/>
  
  <!-- Footer text -->
  <text x="480" y="785" fill="#94a3b8" font-size="11">GABRIEL FROTAS © 2026 - Sistema de Logística</text>
